[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narou-match-agent"
version = "0.1.0"
description = "A local MCP server and Agent Skill for searching Narou Match"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Novel Match contributors" },
]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
narou-match-mcp = "narou_match_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
